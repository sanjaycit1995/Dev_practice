name : node pipeline
on:
    push:
        branches:
            - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Setup Node.js environment
              uses: actions/setup-node@v7
            - name: Install dependencies
              run: npm install
            - name: Run tests
              run: npm test
              